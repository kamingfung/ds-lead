repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, css, javascript, json, yaml]
        exclude: 'package-lock\.json$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-skill-refs
        name: every skill pointer names a skill that exists
        entry: python3 scripts/check_skill_refs.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-palette-sync
        name: deck theme and chart palette share the same colors
        entry: python3 scripts/check_palette_sync.py
        language: system
        pass_filenames: false
        files: ^skills/(make-chart/palette\.css|make-deck/template/theme\.py)$
      - id: check-changelog
        name: CHANGELOG.md has a line for this branch
        entry: python3 scripts/check_changelog.py --base origin/main
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
